<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manav Events – AI Celebration Planner</title>
<style>
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#faf7f2;color:#222}
 header{background:linear-gradient(135deg,#8e2de2,#e94e77);color:#fff;padding:28px 20px;text-align:center}
 header h1{margin:0;font-size:2rem} header p{margin:6px 0 0;opacity:.9}
 main{max-width:1000px;margin:0 auto;padding:20px}
 form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001}
 label{display:flex;flex-direction:column;font-weight:600;font-size:.9rem;gap:6px}
 input,select,textarea{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}
 .full{grid-column:1/-1} textarea{min-height:70px}
 button{grid-column:1/-1;padding:14px;border:0;border-radius:10px;background:#8e2de2;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
 button:disabled{opacity:.6}
 #status{margin:16px 0;font-weight:600;text-align:center}
 .card{background:#fff;border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:0 2px 10px #0001}
 .card h2{margin-top:0;color:#8e2de2}
 table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
 .bar{height:8px;background:#e94e77;border-radius:4px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
 .vendor{border:1px solid #eee;border-radius:10px;padding:12px}
 .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;background:#f1e6ff;color:#6a1bb3;margin-left:6px}
 .timeline li{margin-bottom:12px} .muted{color:#666;font-size:.9rem}
 .print{background:#444;margin-top:8px}
 @media print{form,#status,.print{display:none}header{background:none;color:#000}}
</style>
</head>
<body>
<header><h1>Manav Events</h1><p>AI planner for weddings, birthdays and community events</p></header>
<main>
<form id="f">
  <label>Event type
    <select name="event_type">
      <option>Wedding</option><option>Birthday</option><option>Community event</option>
      <option>Engagement</option><option>Anniversary</option><option>Baby shower</option><option>Festival celebration</option>
    </select></label>
  <label>Event name / description<input name="event_name" placeholder="e.g. Priya & Arjun's wedding"></label>
  <label>Event date<input type="date" name="event_date" required></label>
  <label>Number of guests<input type="number" name="guests" min="1" value="150" required></label>
  <label>Total budget<input type="number" name="budget" min="0" value="500000" required></label>
  <label>Currency
    <select name="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>AED</option></select></label>
  <label class="full">City / venue location<input name="location" placeholder="e.g. Hyderabad"></label>
  <label class="full">Preferences (culture, style, food, must-haves)
    <textarea name="preferences" placeholder="e.g. Telugu traditional wedding, vegetarian menu, eco-friendly decor, live music"></textarea></label>
  <button id="go">Generate my event plan</button>
</form>
<div id="status"></div>
<section id="out" hidden>
  <div class="card"><h2>Summary</h2><p id="summary"></p><button class="print" onclick="window.print()">Print / Save as PDF</button></div>
  <div class="card"><h2>Budget breakdown</h2><table id="budget"></table></div>
  <div class="card"><h2>Timeline</h2><ol class="timeline" id="timeline"></ol></div>
  <div class="card"><h2>Vendor checklist</h2><div class="grid" id="vendors"></div></div>
  <div class="card"><h2>Personalized ideas</h2><div id="ideas"></div></div>
  <div class="card"><h2>Tips</h2><ul id="tips"></ul></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = a => (a || []).map(x => `<li>${esc(x)}</li>`).join('');

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  $('go').disabled = true; $('out').hidden = true;
  $('status').textContent = 'Planning your celebration... (10-30 seconds)';
  try {
    const r = await fetch('/api/plan', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    const p = await r.json();
    if (!r.ok) throw new Error(p.error || 'Request failed');
    render(p, data.currency); $('status').textContent = '';
  } catch (err) { $('status').textContent = 'Error: ' + err.message; }
  finally { $('go').disabled = false; }
});

function render(p, cur) {
  let fmt;
  try { fmt = new Intl.NumberFormat('en-IN', {style:'currency', currency: p.budget?.currency || cur, maximumFractionDigits:0}); }
  catch { fmt = {format: n => n}; }
  $('summary').textContent = p.summary || '';
  const cats = p.budget?.categories || [];
  $('budget').innerHTML = '<tr><th>Category</th><th>Amount</th><th>%</th><th>Notes</th></tr>' +
    cats.map(c => `<tr><td><b>${esc(c.category)}</b><div class="bar" style="width:${Math.min(+c.percent||0,100)}%"></div></td>
      <td>${esc(fmt.format(c.amount||0))}</td><td>${esc(c.percent)}%</td><td class="muted">${esc(c.notes)}</td></tr>`).join('') +
    `<tr><th>Total</th><th>${esc(fmt.format(p.budget?.total || cats.reduce((s,c)=>s+(+c.amount||0),0)))}</th><th></th><th></th></tr>`;
  $('timeline').innerHTML = (p.timeline || []).map(t =>
    `<li><b>${esc(t.when)}</b> <span class="muted">${esc(t.date)}</span><ul>${list(t.tasks)}</ul></li>`).join('');
  $('vendors').innerHTML = (p.vendors || []).map(v =>
    `<div class="vendor"><b>${esc(v.vendor)}</b><span class="pill">${esc(v.priority)}</span>
     <div class="muted">Book by: ${esc(v.book_by)}</div>
     <ul>${(v.checklist||[]).map(x=>`<li><label style="flex-direction:row;font-weight:400"><input type="checkbox"> ${esc(x)}</label></li>`).join('')}</ul>
     <div class="muted"><b>Questions to ask:</b></div><ul class="muted">${list(v.questions_to_ask)}</ul></div>`).join('');
  const i = p.ideas || {};
  $('ideas').innerHTML =
    `<h3>Themes</h3><div class="grid">${(i.themes||[]).map(t=>`<div class="vendor"><b>${esc(t.name)}</b><p class="muted">${esc(t.description)}</p></div>`).join('')}</div>
     <div class="grid"><div><h3>Decor</h3><ul>${list(i.decor)}</ul></div>
     <div><h3>Activities</h3><ul>${list(i.activities)}</ul></div>
     <div><h3>Food</h3><ul>${list(i.food)}</ul></div></div>`;
  $('tips').innerHTML = list(p.tips);
  $('out').hidden = false; $('out').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
